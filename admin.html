<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location Game - 管理者</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    header {
      background: white;
      padding: 15px;
      text-align: center;
    }

    #login {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }

    #game {
      display: none;
      padding: 15px;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    #players {
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

    .player {
      padding: 15px 5px;
      border-bottom: 1px solid #ddd;
    }

    a {
      display: inline-block;
      margin-top: 8px;
    }

    #status {
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 ゲーム管理者</h1>
</header>


<!-- 管理者ログイン -->

<div id="login">

  <h2>🔐 管理者ログイン</h2>

  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
  >

  <input
    id="password"
    type="password"
    placeholder="パスワード"
  >

  <button id="loginButton">
    ログイン
  </button>

  <p id="loginStatus"></p>

</div>


<!-- 管理画面 -->

<div id="game">

  <p id="status">
    📡 参加者情報を読み込んでいます…
  </p>

  <div id="players">
  </div>

</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   Firebase設定
   ================================ */

const firebaseConfig = {

  apiKey: "AIzaSyCEqCLbtEA4PDlSJQVRoPQM_L_nNPalVkI",

  authDomain:
    "location-game-89add.firebaseapp.com",

  databaseURL:
    "https://location-game-89add-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "location-game-89add",

  storageBucket:
    "location-game-89add.firebasestorage.app",

  messagingSenderId:
    "615313457283",

  appId:
    "1:615313457283:web:6fb6ac8a531a757ee19bb6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const database =
  getDatabase(app);


/* ================================
   管理者ログイン
   ================================ */

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    async function() {

      const email =
        document.getElementById(
          "email"
        ).value;

      const password =
        document.getElementById(
          "password"
        ).value;

      const status =
        document.getElementById(
          "loginStatus"
        );


      if (!email || !password) {

        status.textContent =
          "メールアドレスとパスワードを入力してください。";

        return;

      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        status.textContent =
          "ログイン成功！";

      } catch (error) {

        console.error(error);

        status.textContent =
          "ログインに失敗しました。";

      }

    }
  );


/* ================================
   ログイン状態
   ================================ */

onAuthStateChanged(
  auth,
  function(user) {

    if (!user) {
      return;
    }


    document.getElementById(
      "login"
    ).style.display =
      "none";


    document.getElementById(
      "game"
    ).style.display =
      "block";


    loadPlayers();

  }
);


/* ================================
   参加者情報
   ================================ */

function loadPlayers() {

  const playersRef =
    ref(
      database,
      "players"
    );


  onValue(
    playersRef,
    function(snapshot) {

      const data =
        snapshot.val() || {};


      const ids =
        Object.keys(data);


      const container =
        document.getElementById(
          "players"
        );


      document.getElementById(
        "status"
      ).textContent =
        `🟢 現在参加中：${ids.length}人`;


      container.innerHTML = "";


      if (ids.length === 0) {

        container.innerHTML =
          "<p>現在参加者はいません。</p>";

        return;

      }


      ids.forEach(
        function(id) {

          const player =
            data[id];


          const latitude =
            player.latitude;

          const longitude =
            player.longitude;

          const updated =
            player.updatedAt
              ? new Date(
                  player.updatedAt
                ).toLocaleString()
              : "不明";


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "player";


          div.innerHTML = `

            <strong>👤 参加者</strong>

            <br><br>

            緯度：
            ${latitude}

            <br>

            経度：
            ${longitude}

            <br>

            更新：
            ${updated}

            <br>

            <a
              href="https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}"
              target="_blank"
            >
              🗺️ Googleマップで見る
            </a>

          `;


          container.appendChild(
            div
          );

        }
      );

    }
  );

}

</script>

</body>
</html>
