<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ゲーム管理者</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    header {
      padding: 15px;
      background: white;
      text-align: center;
    }

    #login {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    #game {
      display: none;
    }

    #players {
      padding: 15px;
      background: white;
    }

    .player {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .map-link {
      display: inline-block;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 ゲーム管理者</h1>
</header>


<!-- ログイン画面 -->

<div id="login">

  <h2>管理者ログイン</h2>

  <input
    id="email"
    type="email"
    placeholder="メールアドレス">

  <input
    id="password"
    type="password"
    placeholder="パスワード">

  <button id="loginButton">
    ログイン
  </button>

  <p id="loginStatus"></p>

</div>


<!-- 管理者画面 -->

<div id="game">

  <div id="players">
    読み込み中…
  </div>

</div>


<script type="module">

import {
  initializeApp
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  onValue
} from
"https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/*
================================
Firebase設定
================================

index.htmlと同じ設定を入れる
*/

const firebaseConfig = {

  apiKey: "ここにAPIキー",

  authDomain: "ここにAuthDomain",

  databaseURL: "ここにDatabaseURL",

  projectId: "ここにProjectID",

  storageBucket: "ここにStorageBucket",

  messagingSenderId: "ここにMessagingSenderId",

  appId: "ここにAppID"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const database =
  getDatabase(app);


/*
================================
ログイン
================================
*/

document
  .getElementById("loginButton")
  .addEventListener(
    "click",
    async function() {

      const email =
        document.getElementById("email").value;

      const password =
        document.getElementById("password").value;

      const status =
        document.getElementById("loginStatus");

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        status.textContent =
          "ログインしました。";

      } catch (error) {

        console.error(error);

        status.textContent =
          "ログインできませんでした。";

      }

    }
  );


/*
================================
ログイン状態確認
================================
*/

onAuthStateChanged(
  auth,
  function(user) {

    if (user) {

      document.getElementById(
        "login"
      ).style.display = "none";

      document.getElementById(
        "game"
      ).style.display = "block";


      loadPlayers();

    }

  }
);


/*
================================
参加者データ取得
================================
*/

function loadPlayers() {

  const playersRef =
    ref(
      database,
      "players"
    );


  onValue(
    playersRef,
    function(snapshot) {

      const players =
        snapshot.val() || {};

      const container =
        document.getElementById(
          "players"
        );


      const ids =
        Object.keys(players);


      container.innerHTML =
        `<h2>参加者：${ids.length}人</h2>`;


      ids.forEach(
        function(id) {

          const player =
            players[id];


          const latitude =
            player.latitude;

          const longitude =
            player.longitude;


          const time =
            new Date(
              player.updatedAt
            ).toLocaleString();


          const div =
            document.createElement(
              "div"
            );


          div.className =
            "player";


          div.innerHTML = `

            <strong>👤 参加者</strong>

            <br>

            📍 緯度：
            ${latitude}

            <br>

            📍 経度：
            ${longitude}

            <br>

            🕒 更新：
            ${time}

            <br>

            <a
              class="map-link"
              href="https://www.google.com/maps/search/?api=1&query=${latitude},${longitude}"
              target="_blank"
            >
              🗺️ Googleマップで見る
            </a>

          `;


          container.appendChild(
            div
          );

        }
      );

    }
  );

}

</script>

</body>
</html>
