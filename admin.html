<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>位置ゲーム - 管理者</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f5f5f5;
    }

    header {
      background: white;
      padding: 15px;
      text-align: center;
    }

    #login {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }

    #game {
      display: none;
      padding: 15px;
    }

    input,
    button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
    }

    #players {
      background: white;
      padding: 15px;
      border-radius: 12px;
    }

    .player {
      padding: 15px 5px;
      border-bottom: 1px solid #ddd;
    }

    #status {
      font-weight: bold;
    }

    .error {
      color: #c00;
      font-weight: bold;
    }

    .success {
      color: #080;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 ゲーム管理者</h1>
</header>

<!-- 管理者ログイン -->
<div id="login">

  <h2>🔐 管理者ログイン</h2>

  <input
    id="email"
    type="email"
    placeholder="メールアドレス"
    autocomplete="username"
  >

  <input
    id="password"
    type="password"
    placeholder="パスワード"
    autocomplete="current-password"
  >

  <button id="loginButton">
    ログイン
  </button>

  <p id="loginStatus"></p>

</div>

<!-- 管理画面 -->
<div id="game">

  <p id="status"></p>

  <button id="logoutButton">
    ログアウト
  </button>

  <div id="players"></div>

</div>

<script type="module">

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    onValue
  } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  /* ================================
     Firebase設定
     ================================= */

  const firebaseConfig = {
    apiKey: "AIzaSyCEqCLbtEA4PDlSJQVRoPQM_L_nNPalVkI",
    authDomain: "location-game-89add.firebaseapp.com",
    databaseURL: "https://location-game-89add-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "location-game-89add",
    storageBucket: "location-game-89add.firebasestorage.app",
    messagingSenderId: "615313457283",
    appId: "1:615313457283:web:6fb6ac8a531a757ee19bb6"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const database = getDatabase(app);


  /* ================================
     HTML要素
     ================================= */

  const login = document.getElementById("login");
  const game = document.getElementById("game");

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  const loginButton = document.getElementById("loginButton");
  const logoutButton = document.getElementById("logoutButton");

  const loginStatus = document.getElementById("loginStatus");

  const status = document.getElementById("status");
  const playersContainer = document.getElementById("players");


  /* ================================
     管理者ログイン
     ================================= */

  loginButton.addEventListener("click", async () => {

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email || !password) {

      loginStatus.textContent =
        "メールアドレスとパスワードを入力してください。";

      loginStatus.className = "error";

      return;
    }


    loginButton.disabled = true;

    loginStatus.textContent =
      "ログインしています…";

    loginStatus.className = "";


    try {

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      loginStatus.textContent =
        "ログイン成功！";

      loginStatus.className = "success";


    } catch (error) {

      console.error(error);

      loginStatus.textContent =
        "ログインに失敗しました: " + error.message;

      loginStatus.className = "error";

      loginButton.disabled = false;

    }

  });


  /* ================================
     ログアウト
     ================================= */

  logoutButton.addEventListener("click", async () => {

    try {

      await signOut(auth);

    } catch (error) {

      console.error(error);

    }

  });


  /* ================================
     ログイン状態監視
     ================================= */

  onAuthStateChanged(auth, (user) => {

    /*
     * ログインしていない場合
     * → 参加者情報を絶対に読み込まない
     */

    if (!user) {

      login.style.display = "block";
      game.style.display = "none";

      playersContainer.innerHTML = "";

      status.textContent = "";

      return;
    }


    /*
     * ログイン済みの場合だけ管理画面を表示
     */

    login.style.display = "none";
    game.style.display = "block";


    status.textContent =
      "📡 参加者情報を読み込んでいます…";

    status.className = "";


    loadPlayers();

  });


  /* ================================
     参加者情報読み込み
     ================================= */

  function loadPlayers() {

    const playersRef =
      ref(database, "players");


    onValue(
      playersRef,

      (snapshot) => {

        const data = snapshot.val() || {};

        const ids = Object.keys(data);


        playersContainer.innerHTML = "";


        status.textContent =
          `🟢 現在登録されている参加者：${ids.length}人`;

        status.className = "success";


        if (ids.length === 0) {

          playersContainer.innerHTML =
            "<p>現在の参加者はいません。</p>";

          return;
        }


        ids.forEach((id) => {

          const player = data[id] || {};


          const latitude =
            player.latitude ?? "不明";

          const longitude =
            player.longitude ?? "不明";

          const accuracy =
            player.accuracy ?? "不明";

          const sharing =
            player.sharing ?? "不明";

          const updated =
            player.updatedAt
              ? new Date(player.updatedAt).toLocaleString()
              : "不明";


          const div =
            document.createElement("div");


          div.className = "player";


          div.innerHTML = `

            <strong>👤 参加者</strong>

            <br><br>

            <strong>UID:</strong>
            ${escapeHtml(id)}

            <br><br>

            <strong>緯度:</strong>
            ${escapeHtml(latitude)}

            <br>

            <strong>経度:</strong>
            ${escapeHtml(longitude)}

            <br>

            <strong>位置情報の精度:</strong>
            ${escapeHtml(accuracy)}

            <br>

            <strong>共有状態:</strong>
            ${escapeHtml(sharing)}

            <br>

            <strong>最終更新:</strong>
            ${escapeHtml(updated)}

            <br><br>

            ${
              latitude !== "不明" &&
              longitude !== "不明"
                ? `
                  <a
                    href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(latitude)},${encodeURIComponent(longitude)}"
                    target="_blank"
                    rel="noopener noreferrer"
                  >
                    🗺️ Googleマップで見る
                  </a>
                `
                : ""
            }

          `;


          playersContainer.appendChild(div);

        });

      },

      (error) => {

        console.error(error);

        status.textContent =
          "❌ 参加者情報を読み込めませんでした";

        status.className = "error";


        playersContainer.innerHTML = `

          <p class="error">
            Firebaseから参加者情報を取得できませんでした。
          </p>

          <p>
            エラー:
            ${escapeHtml(error.message)}
          </p>

        `;

      }

    );

  }


  /* ================================
     HTMLエスケープ
     ================================= */

  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }

</script>

</body>
</html>
