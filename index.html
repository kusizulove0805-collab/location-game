<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 20px 0 10px;
    }

    #status {
      padding: 10px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 65vh;
      background: #ddd;
    }

    button {
      padding: 14px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    #stopButton {
      display: none;
      background: #ddd;
    }
  </style>
</head>

<body>

  <h1>📍 Location Game</h1>

  <p>
    このゲームでは、ゲームプレイのために<br>
    <strong>現在地をゲーム管理者へ共有します。</strong>
  </p>

  <button id="startButton" onclick="startSharing()">
    現在地の共有を開始
  </button>

  <button id="stopButton" onclick="stopSharing()">
    現在地の共有を停止
  </button>

  <p id="status">共有していません</p>

  <div id="map"></div>


  <!-- Firebase -->
  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getDatabase,
      ref,
      set,
      remove
    }
      from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


    /*
      Firebaseコンソールから取得した設定をここに入れる
    */

    const firebaseConfig = {
      apiKey: "ここにAPIキー",
      authDomain: "ここにAuthDomain",
      databaseURL: "ここにDatabaseURL",
      projectId: "ここにProjectID",
      storageBucket: "ここにStorageBucket",
      messagingSenderId: "ここにMessagingSenderId",
      appId: "ここにAppID"
    };


    const app = initializeApp(firebaseConfig);

    const database = getDatabase(app);


    let watchId = null;

    // この参加者を識別するID
    let playerId = localStorage.getItem("playerId");

    if (!playerId) {
      playerId =
        crypto.randomUUID();

      localStorage.setItem(
        "playerId",
        playerId
      );
    }


    window.startSharing = function () {

      if (!navigator.geolocation) {

        document.getElementById("status").textContent =
          "このブラウザは位置情報に対応していません。";

        return;
      }


      document.getElementById("status").textContent =
        "位置情報を取得しています…";


      watchId =
        navigator.geolocation.watchPosition(

          async function(position) {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;


            /*
              Firebaseへ現在地を送信
            */

            await set(
              ref(
                database,
                "players/" + playerId
              ),
              {
                latitude: latitude,
                longitude: longitude,
                updatedAt: Date.now()
              }
            );


            document.getElementById("status").textContent =
              "🟢 現在地を管理者へ共有中";


            /*
              Googleマップ表示
            */

            const mapUrl =
              "https://www.google.com/maps?q=" +
              latitude +
              "," +
              longitude +
              "&output=embed";


            document.getElementById("map").innerHTML =
              `
              <iframe
                src="${mapUrl}"
                width="100%"
                height="100%"
                style="border:0;"
                loading="lazy">
              </iframe>
              `;


            /*
              あとでここにゲームを接続
            */

            startGame(
              latitude,
              longitude
            );

          },

          function(error) {

            document.getElementById("status").textContent =
              "位置情報を取得できませんでした。";

          },

          {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
          }
        );


      document.getElementById("startButton")
        .style.display = "none";

      document.getElementById("stopButton")
        .style.display = "inline-block";
    };


    window.stopSharing = async function () {

      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

        watchId = null;
      }


      /*
        Firebaseから現在地を削除
      */

      await remove(
        ref(
          database,
          "players/" + playerId
        )
      );


      document.getElementById("status").textContent =
        "🔴 現在地の共有を停止しました";


      document.getElementById("startButton")
        .style.display = "inline-block";

      document.getElementById("stopButton")
        .style.display = "none";
    };


    function startGame(latitude, longitude) {

      console.log(
        "ゲーム開始",
        latitude,
        longitude
      );

      /*
        後でゲーム本体をここに接続する
      */

    }

  </script>

</body>
</html>
