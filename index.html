<!DOCTYPE html><html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>地理 Game</title>  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 25px 0 15px;
    }

    #status {
      padding: 15px;
      font-weight: bold;
    }

    button {
      padding: 14px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
    }

    #stopButton {
      display: none;
    }

    #gameArea {
      margin: 20px;
    }
  </style></head><body><h1>📍 地理 Game</h1><p>
  ゲームを開始しよう<br>
</p><button id="startButton">
  🎮 ゲームを開始
</button><button id="stopButton">
  🛑 お待ちください
</button><p id="status">
  ゲームを開始していません
</p><div id="gameArea">
  <!-- ここにゲーム本体を入れる -->
</div><script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   Firebase設定
   ================================ */

const firebaseConfig = {

  apiKey:
    "AIzaSyCEqCLbtEA4PDlSJQVRoPQM_L_nNPalVkI",

  authDomain:
    "location-game-89add.firebaseapp.com",

  databaseURL:
    "https://location-game-89add-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "location-game-89add",

  storageBucket:
    "location-game-89add.firebasestorage.app",

  messagingSenderId:
    "615313457283",

  appId:
    "1:615313457283:web:6fb6ac8a531a757ee19bb6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const database =
  getDatabase(app);


let watchId = null;
let playerId = null;
let gameStarted = false;


/* ================================
   匿名ログイン
   ================================ */

async function login() {

  try {

    const result =
      await signInAnonymously(auth);

    playerId =
      result.user.uid;

    return true;

  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "参加者登録に失敗しました。";

    return false;

  }

}


/* ================================
   ゲーム開始
   ================================ */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    async function() {

      if (gameStarted) {
        return;
      }


      if (!playerId) {

        const success =
          await login();

        if (!success) {
          return;
        }

      }


      if (!navigator.geolocation) {

        document.getElementById(
          "status"
        ).textContent =
          "この端末は位置情報に対応していません。";

        return;

      }


      document.getElementById(
        "status"
      ).textContent =
        "📍 データ確認しています…";


      /*
       * 最初の位置情報を取得して
       * 精度を確認する
       */

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const accuracy =
            position.coords.accuracy;


          /*
           * めっちょゆるめの判定
           *
           * 500m以内ならゲーム開始
           */

          if (accuracy > 500) {

            document.getElementById(
              "status"
            ).textContent =
              "📍 位置情報が少し粗すぎます。正確な位置情報を許可してください。";

            return;

          }


          /*
           * ゲーム開始
           */

          gameStarted = true;


          document.getElementById(
            "status"
          ).textContent =
            "🟢 ゲーム開始中";


          document.getElementById(
            "startButton"
          ).style.display =
            "none";


          document.getElementById(
            "stopButton"
          ).style.display =
            "inline-block";


          /*
           * 継続的な位置情報取得
           */

          startLocationTracking();

        },

        function(error) {

          console.error(error);

          let message =
            "位置情報を取得できませんでした。";


          if (error.code === 1) {

            message =
              "📍 位置情報が拒否されています。ゲームをするには位置情報を許可してください。";

          }


          if (error.code === 2) {

            message =
              "📍 現在地を取得できませんでした。";

          }


          if (error.code === 3) {

            message =
              "📍 位置情報の取得がタイムアウトしました。";

          }


          document.getElementById(
            "status"
          ).textContent =
            message;

        },

        {

          enableHighAccuracy:
            true,

          maximumAge:
            5000,

          timeout:
            15000

        }

      );

    }
  );


/* ================================
   継続的な位置情報取得
   ================================ */

function startLocationTracking() {

  if (watchId !== null) {

    navigator.geolocation.clearWatch(
      watchId
    );

  }


  watchId =
    navigator.geolocation.watchPosition(

      async function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;

        const accuracy =
          position.coords.accuracy;


        /*
         * Firebaseへ保存
         */

        if (playerId) {

          try {

            await set(

              ref(
                database,
                "players/" + playerId
              ),

              {

                latitude:
                  latitude,

                longitude:
                  longitude,

                accuracy:
                  accuracy,

                updatedAt:
                  Date.now(),

                sharing:
                  true

              }

            );

          } catch (error) {

            console.error(error);

          }

        }


        /*
         * ゲーム本体へ位置情報を渡す
         */

        startGame(
          latitude,
          longitude,
          accuracy
        );

      },

      function(error) {

        console.error(error);

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          5000,

        timeout:
          15000

      }

    );

}


/* ================================
   管理者への共有停止
   ================================ */

document
  .getElementById("stopButton")
  .addEventListener(
    "click",
    async function() {

      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

        watchId = null;

      }


      /*
       * 位置情報そのものは削除しない。
       *
       * 最後に取得した位置を
       * 管理者が確認できるようにする。
       */

      if (playerId) {

        try {

          await set(

            ref(
              database,
              "players/" +
              playerId +
              "/sharing"
            ),

            false

          );

        } catch (error) {

          console.error(error);

        }

      }


      gameStarted = false;


      document.getElementById(
        "status"
      ).textContent =
        "🔴 ゲームの開始を停止しました";


      document.getElementById(
        "startButton"
      ).style.display =
        "inline-block";


      document.getElementById(
        "stopButton"
      ).style.display =
        "none";

    }
  );


/* ================================
   ゲーム本体
   ================================ */

function startGame(
  latitude,
  longitude,
  accuracy
) {

  console.log(
    "現在地:",
    latitude,
    longitude
  );

  console.log(
    "位置精度:",
    accuracy,
    "m"
  );


  /*
   * ここにゲーム本体の処理を追加する。
   */

}

</script></body>
</html>
