<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    #map {
      width: 100%;
      height: 70vh;
      background: #ddd;
    }

    button {
      margin: 20px;
      padding: 14px 24px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>📍 Location Game</h1>

  <button onclick="getLocation()">現在地を取得する</button>

  <p id="status">位置情報の許可が必要です</p>

  <div id="map"></div>

  <script>
    function getLocation() {

      if (!navigator.geolocation) {
        document.getElementById("status").textContent =
          "このブラウザは位置情報に対応していません。";
        return;
      }

      document.getElementById("status").textContent =
        "現在地を取得しています…";

      navigator.geolocation.getCurrentPosition(

        function(position) {

          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;

          document.getElementById("status").textContent =
            "現在地を取得しました！";

          // Googleマップを開く
          const mapUrl =
            "https://www.google.com/maps?q=" +
            latitude + "," + longitude;

          document.getElementById("map").innerHTML =
            '<iframe ' +
            'src="' + mapUrl + '&output=embed" ' +
            'width="100%" ' +
            'height="100%" ' +
            'style="border:0;" ' +
            'allowfullscreen="" ' +
            'loading="lazy">' +
            '</iframe>';

          // あとでゲームに位置情報を渡す
          startGame(latitude, longitude);
        },

        function(error) {

          document.getElementById("status").textContent =
            "位置情報を取得できませんでした。";

        }
      );
    }

    function startGame(latitude, longitude) {

      console.log("ゲーム開始");

      console.log("緯度:", latitude);
      console.log("経度:", longitude);

      // あとでここにゲーム本体を接続する
    }
  </script>

</body>
</html>
