<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 20px 0 10px;
    }

    #status {
      padding: 10px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 65vh;
      background: #ddd;
    }

    button {
      padding: 14px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    #stopButton {
      display: none;
    }
  </style>
</head>

<body>

<h1>📍 Location Game</h1>

<p>
  このゲームではゲームプレイのために<br>
  <strong>現在地をゲーム管理者へ共有します。</strong>
</p>

<button id="startButton">
  現在地の共有を開始
</button>

<button id="stopButton">
  現在地の共有を停止
</button>

<p id="status">
  共有していません
</p>

<div id="map"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  remove
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/* ================================
   Firebase設定
   ================================ */

const firebaseConfig = {

  apiKey: "AIzaSyCEqCLbtEA4PDlSJQVRoPQM_L_nNPalVkI",

  authDomain: "location-game-89add.firebaseapp.com",

  databaseURL:
    "https://location-game-89add-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId: "location-game-89add",

  storageBucket:
    "location-game-89add.firebasestorage.app",

  messagingSenderId: "615313457283",

  appId:
    "1:615313457283:web:6fb6ac8a531a757ee19bb6"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const database =
  getDatabase(app);


let watchId = null;
let playerId = null;


/* ================================
   匿名ログイン
   ================================ */

async function login() {

  try {

    const result =
      await signInAnonymously(auth);

    playerId =
      result.user.uid;

    console.log(
      "参加者ID:",
      playerId
    );

    return true;

  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "参加者登録に失敗しました。";

    return false;

  }

}


/* ================================
   現在地共有開始
   ================================ */

document
  .getElementById("startButton")
  .addEventListener(
    "click",
    async function() {

      if (!playerId) {

        const success =
          await login();

        if (!success) {
          return;
        }

      }


      if (!navigator.geolocation) {

        document.getElementById(
          "status"
        ).textContent =
          "この端末は位置情報に対応していません。";

        return;

      }


      document.getElementById(
        "status"
      ).textContent =
        "📍 現在地を取得しています…";


      watchId =
        navigator.geolocation.watchPosition(

          async function(position) {

            const latitude =
              position.coords.latitude;

            const longitude =
              position.coords.longitude;


            /* Firebaseへ現在地を送信 */

            try {

              await set(

                ref(
                  database,
                  "players/" + playerId
                ),

                {
                  latitude:
                    latitude,

                  longitude:
                    longitude,

                  updatedAt:
                    Date.now()
                }

              );

            } catch (error) {

              console.error(error);

              document.getElementById(
                "status"
              ).textContent =
                "現在地の送信に失敗しました。";

              return;

            }


            document.getElementById(
              "status"
            ).textContent =
              "🟢 現在地を管理者へ共有中";


            /* 現在地をGoogleマップで表示 */

            const mapUrl =
              "https://www.google.com/maps?q=" +
              latitude +
              "," +
              longitude +
              "&output=embed";


            document.getElementById(
              "map"
            ).innerHTML =

              `
              <iframe
                src="${mapUrl}"
                width="100%"
                height="100%"
                style="border:0;"
                loading="lazy">
              </iframe>
              `;


            /* ゲーム本体へ現在地を渡す */

            startGame(
              latitude,
              longitude
            );

          },


          function(error) {

            console.error(error);

            let message =
              "位置情報を取得できませんでした。";


            if (error.code === 1) {

              message =
                "位置情報の利用が許可されていません。";

            }


            if (error.code === 2) {

              message =
                "現在地を取得できませんでした。";

            }


            if (error.code === 3) {

              message =
                "位置情報の取得がタイムアウトしました。";

            }


            document.getElementById(
              "status"
            ).textContent =
              message;

          },


          {
            enableHighAccuracy:
              true,

            maximumAge:
              5000,

            timeout:
              10000
          }

        );


      document.getElementById(
        "startButton"
      ).style.display =
        "none";


      document.getElementById(
        "stopButton"
      ).style.display =
        "inline-block";

    }
  );


/* ================================
   現在地共有停止
   ================================ */

document
  .getElementById("stopButton")
  .addEventListener(
    "click",
    async function() {

      if (watchId !== null) {

        navigator.geolocation.clearWatch(
          watchId
        );

        watchId = null;

      }


      if (playerId) {

        try {

          await remove(

            ref(
              database,
              "players/" + playerId
            )

          );

        } catch (error) {

          console.error(error);

        }

      }


      document.getElementById(
        "status"
      ).textContent =
        "🔴 現在地の共有を停止しました";


      document.getElementById(
        "startButton"
      ).style.display =
        "inline-block";


      document.getElementById(
        "stopButton"
      ).style.display =
        "none";

    }
  );


/* ================================
   ゲーム本体
   ================================ */

function startGame(
  latitude,
  longitude
) {

  console.log(
    "ゲーム開始"
  );

  console.log(
    "現在地:",
    latitude,
    longitude
  );


  /*
    ここに後からゲーム本体のコードを入れる
  */

}

</script>

</body>
</html>
