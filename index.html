<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Location Game</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
    }

    h1 {
      margin: 20px 0 10px;
    }

    #status {
      padding: 10px;
      font-weight: bold;
    }

    #map {
      width: 100%;
      height: 65vh;
      background: #ddd;
    }

    button {
      padding: 14px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      font-size: 17px;
    }

    #stopButton {
      display: none;
    }
  </style>
</head>

<body>

<h1>📍 Location Game</h1>

<p>
  このゲームでは、ゲームプレイのために<br>
  <strong>現在地をゲーム管理者へ共有します。</strong>
</p>

<button id="startButton">
  現在地の共有を開始
</button>

<button id="stopButton">
  現在地の共有を停止
</button>

<p id="status">
  共有していません
</p>

<div id="map"></div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  signInAnonymously
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
  getDatabase,
  ref,
  set,
  remove
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


/*
================================
Firebase設定
================================

Firebaseコンソール

プロジェクト設定
↓
マイアプリ
↓
Webアプリ

から取得した値を入れる。
*/

const firebaseConfig = {

  apiKey: "ここにAPIキー",

  authDomain: "ここにAuthDomain",

  databaseURL: "ここにDatabaseURL",

  projectId: "ここにProjectID",

  storageBucket: "ここにStorageBucket",

  messagingSenderId: "ここにMessagingSenderId",

  appId: "ここにAppID"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const database =
  getDatabase(app);


let watchId = null;

let playerId = null;


/*
================================
匿名ログイン
================================
*/

async function login() {

  try {

    const result =
      await signInAnonymously(auth);

    playerId =
      result.user.uid;

    console.log(
      "参加者ID:",
      playerId
    );

  } catch (error) {

    console.error(error);

    document.getElementById(
      "status"
    ).textContent =
      "ログインに失敗しました。";

  }

}


/*
================================
共有開始
================================
*/

document.getElementById(
  "startButton"
).addEventListener(
  "click",
  async function() {

    if (!playerId) {

      await login();

    }

    if (!navigator.geolocation) {

      document.getElementById(
        "status"
      ).textContent =
        "位置情報に対応していません。";

      return;

    }


    document.getElementById(
      "status"
    ).textContent =
      "位置情報を取得しています…";


    watchId =
      navigator.geolocation.watchPosition(

        async function(position) {

          const latitude =
            position.coords.latitude;

          const longitude =
            position.coords.longitude;


          /*
          Firebaseへ送信
          */

          await set(

            ref(
              database,
              "players/" + playerId
            ),

            {

              latitude:
                latitude,

              longitude:
                longitude,

              updatedAt:
                Date.now()

            }

          );


          document.getElementById(
            "status"
          ).textContent =
            "🟢 現在地を管理者へ共有中";


          /*
          現在地をGoogleマップ表示
          */

          const mapUrl =
            "https://www.google.com/maps?q=" +
            latitude +
            "," +
            longitude +
            "&output=embed";


          document.getElementById(
            "map"
          ).innerHTML =

            `
            <iframe
              src="${mapUrl}"
              width="100%"
              height="100%"
              style="border:0;"
              loading="lazy">
            </iframe>
            `;


          /*
          後でゲームを接続
          */

          startGame(
            latitude,
            longitude
          );

        },

        function(error) {

          document.getElementById(
            "status"
          ).textContent =
            "位置情報を取得できませんでした。";

        },

        {

          enableHighAccuracy:
            true,

          maximumAge:
            5000,

          timeout:
            10000

        }

      );


    document.getElementById(
      "startButton"
    ).style.display =
      "none";


    document.getElementById(
      "stopButton"
    ).style.display =
      "inline-block";

  }
);


/*
================================
共有停止
================================
*/

document.getElementById(
  "stopButton"
).addEventListener(
  "click",
  async function() {

    if (watchId !== null) {

      navigator.geolocation.clearWatch(
        watchId
      );

      watchId = null;

    }


    if (playerId) {

      await remove(

        ref(
          database,
          "players/" + playerId
        )

      );

    }


    document.getElementById(
      "status"
    ).textContent =
      "🔴 現在地の共有を停止しました";


    document.getElementById(
      "startButton"
    ).style.display =
      "inline-block";


    document.getElementById(
      "stopButton"
    ).style.display =
      "none";

  }
);


/*
================================
ゲーム本体
================================
*/

function startGame(
  latitude,
  longitude
) {

  console.log(
    "ゲーム開始"
  );

  console.log(
    "緯度:",
    latitude
  );

  console.log(
    "経度:",
    longitude
  );


  /*
  後で君のゲームコードを
  ここに接続する
  */

}


</script>

</body>
</html>
